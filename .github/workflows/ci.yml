name: CI

on:
  push:
    branches: [main]
  pull_request:

# 같은 브랜치에 연달아 푸시하면 이전 실행을 취소한다
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # 빌드에는 값의 유효성이 아니라 존재 여부만 필요하다.
      # 실제 크레덴셜은 CI에 넣지 않는다 — 이 워크플로는 외부에 접속하지 않는다.
      NEXT_PUBLIC_SUPABASE_URL: https://ci.invalid
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key
      SUPABASE_SERVICE_ROLE_KEY: ci-service-role-key
      NEXT_PUBLIC_HLS_BASE_URL: https://ci.invalid
      NEXT_PUBLIC_WHEP_BASE_URL: https://ci.invalid
      NEXT_PUBLIC_WS_URL: https://ci.invalid
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_ci
      STRIPE_SECRET_KEY: sk_test_ci
      STRIPE_WEBHOOK_SECRET: whsec_ci

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # 순서에 의미가 있다: 싼 것부터 돌려서 빨리 실패시킨다.
      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      # verify:payout은 아래 `verify-payout` 잡에서 돈다 (Supabase 로컬 DB).
      # verify:security는 아직 CI에 없다 — 앱·채팅·Redis·MediaMTX가 전부 떠야 한다.
      # 그전까지는 로컬에서 손으로 돌린다.

      - name: Build
        run: pnpm build

  # 돈이 오가는 DB 함수 검사 (46개). 후원이 수신자 revenue_balance로 가는지(카드깡 차단),
  # 환전 차감·복원, 홀드 기간, anon/authenticated 실행 권한 잠금까지 본다.
  #
  # 매번 빈 Supabase를 새로 띄우고 supabase/migrations/ 001~을 처음부터 적용한다.
  # 그래서 "처음부터 만들어도 마이그레이션이 다 되는가"도 같이 검사된다.
  # 맨 Postgres 컨테이너로는 안 된다 — anon/authenticated 롤과 auth·storage 스키마가 필요하다.
  # 운영 DB에는 접속하지 않는다. 크레덴셜도 없다.
  verify-payout:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: supabase/setup-cli@v1
        with:
          version: 2.117.0

      # DB와 storage만 띄운다. 006_thumbnails가 storage.buckets를 쓰므로 storage-api는 필요하다.
      # 나머지(관리 화면·메일·realtime 등)는 이 검사에 쓰이지 않아 시간만 잡아먹는다.
      - name: Start Supabase (migrations applied)
        run: supabase start -x gotrue,realtime,imgproxy,kong,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor

      - name: verify:payout
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: pnpm verify:payout
