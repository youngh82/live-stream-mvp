name: CI

on:
  push:
    branches: [main]
  pull_request:

# 같은 브랜치에 연달아 푸시하면 이전 실행을 취소한다
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # 빌드에는 값의 유효성이 아니라 존재 여부만 필요하다.
      # 실제 크레덴셜은 CI에 넣지 않는다 — 이 워크플로는 외부에 접속하지 않는다.
      NEXT_PUBLIC_SUPABASE_URL: https://ci.invalid
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key
      SUPABASE_SERVICE_ROLE_KEY: ci-service-role-key
      NEXT_PUBLIC_HLS_BASE_URL: https://ci.invalid
      NEXT_PUBLIC_WHEP_BASE_URL: https://ci.invalid
      NEXT_PUBLIC_WS_URL: https://ci.invalid
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_ci
      STRIPE_SECRET_KEY: sk_test_ci
      STRIPE_WEBHOOK_SECRET: whsec_ci

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # 순서에 의미가 있다: 싼 것부터 돌려서 빨리 실패시킨다.
      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      # 아직 CI에 없는 것 — 둘 다 살아있는 스택이 필요하다:
      #   verify:payout  — .env.local + 실제 Postgres. 게다가 anon/authenticated
      #                    롤 검사가 있어 맨 Postgres 컨테이너로는 안 되고
      #                    Supabase 롤이 있어야 한다.
      #   verify:security — Redis + MediaMTX + Supabase가 전부 떠야 한다.
      # 관문 1(배포)에서 스택을 컨테이너로 세운 뒤 service container로 붙인다.
      # 그전까지는 로컬에서 손으로 돌린다.

      - name: Build
        run: pnpm build
