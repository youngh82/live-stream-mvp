name: Build images

# main이 바뀔 때만 돈다. **기능 브랜치에 커밋을 푸시해도 배포되지 않는다** —
# 배포는 PR을 머지하는 순간에만 일어난다.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-images
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          - name: lsm-app
            dockerfile: infra/Dockerfile.app
          - name: lsm-chat
            dockerfile: infra/Dockerfile.chat
          - name: lsm-thumbnailer
            dockerfile: infra/Dockerfile.thumbnailer

    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.name }}:latest
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.name }}:${{ github.sha }}
          # 레이어 캐시. 없으면 매번 pnpm install부터 다시 한다.
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          # ⚠️ NEXT_PUBLIC_* 는 런타임이 아니라 **빌드 시점에 번들에 박힌다.**
          #    그래서 여기서 넘긴다. 주소를 바꾸려면 이미지를 다시 빌드해야 한다.
          #    시크릿(service role, Stripe secret)은 절대 넘기지 않는다 —
          #    build arg는 이미지 히스토리에 그대로 남는다.
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
            NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
            NEXT_PUBLIC_HLS_BASE_URL=https://hls.${{ vars.APP_DOMAIN }}
            NEXT_PUBLIC_WHEP_BASE_URL=https://whep.${{ vars.APP_DOMAIN }}
            NEXT_PUBLIC_WS_URL=https://ws.${{ vars.APP_DOMAIN }}
