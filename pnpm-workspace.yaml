allowBuilds:
  # vitest가 끌고 온 선택적 네이티브 의존. 둘 다 빌드하지 않는다.
  # 트랜스폼은 esbuild(아래 true)가 하고, watcher는 없으면 폴백이 동작한다.
  # 비워두면 pnpm install이 ERR_PNPM_IGNORED_BUILDS로 실패해서 CI가 못 돈다.
  '@parcel/watcher': false
  # 소스맵 업로드용 바이너리를 내려받는 스크립트다. 업로드는 아직 안 한다 (auth token 필요).
  '@sentry/cli': false
  '@swc/core': false
  esbuild: true
  sharp: false
  unrs-resolver: false
